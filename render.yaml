# Render Blueprint — https://render.com/docs/blueprint-spec
# In the Render dashboard: New + > Blueprint > pick this repo. Render reads
# this file and pre-fills the service below; no manual config needed.
#
# server/serve.js serves both the built app (dist/) and the neural TTS +
# dictation-fetch APIs from a single process. Free tier: sleeps after ~15 min
# idle; the app's own warm-up ping (src/useServerReady.js) wakes it and shows
# an overlay while it does.
services:
  - type: web
    name: dictationapp
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Vite 8 / rolldown require ^20.19.0 || >=22.12.0 (they import
      # `styleText` from node:util, added in 20.12.0). Node 24 is what this is
      # developed and tested against; the bare major keeps picking up 24.x
      # security patches instead of freezing on one patch release.
      - key: NODE_VERSION
        value: "24"
